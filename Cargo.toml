[package]
name = "llm-wiki-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4", features = ["clock"] }
rmcp = { version = "3.10.0", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.3"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2"
notify = "8.2.2"
